[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ekiben"
version = "0.1.0"
description = "bento.me-like personal profile page static site generator"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
]

[project.scripts]
ekiben = "ekiben.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["ekiben*"]

[tool.setuptools.package-data]
ekiben = ["templates/*"]
